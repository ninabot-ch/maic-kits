# ÉCHANTILLON du thème « cabinet » — contenu FICTIF (Morand & Keller, Lausanne). Aucun chiffre ci-dessous ne décrit une vraie entreprise.
fr:
  hero:
    kicker: Fiduciaire — Lausanne
    title: Des comptes clairs, des décisions sereines.
    text: Comptabilité, fiscalité, salaires et conseil pour les indépendants et les PME de Suisse romande. Deux associés, une équipe de six, des réponses en 24 heures.
    cta: Demander un entretien
    cta2: Nos prestations
    cta2_href: "#services"
  about:
    title: Le cabinet
    text: Fondé par Sophie Morand et Thomas Keller, tous deux experts-comptables diplômés, le cabinet accompagne une centaine de mandats, du restaurant familial à la start-up en levée de fonds. Nous ne facturons pas à la minute et nous répondons au téléphone.
    quote: Un bon fiduciaire vous appelle avant l'échéance, pas après.
    icon: scale
  split:
    - title: Un interlocuteur, pas un guichet
      text: Chaque mandat a un responsable attitré qui connaît votre dossier. Il vous appelle quand quelque chose bouge — TVA, impôt, AVS — pas seulement quand vous le sollicitez.
      icon: users
  services_title: Nos prestations
  services:
    - title: Comptabilité
      text: Tenue, bouclement, comptes annuels, TVA — sur votre outil ou le nôtre.
      detail: Bexio, Abacus ou Banana. Bouclement livré dans les 60 jours après la clôture, rapport commenté en une page.
      icon: chart
      price: dès 290 CHF / mois
    - title: Fiscalité
      text: Déclarations des personnes physiques et morales, optimisation légale, représentation devant l'administration.
      detail: Simulation avant la fin de l'année pour décider des amortissements, du salaire et du dividende.
      icon: scale
      price: dès 450 CHF
    - title: Salaires
      text: Fiches, décomptes AVS, LPP, impôt à la source, certificats de salaire.
      detail: Dès le premier employé. Nous gérons les annonces aux caisses et les contrôles.
      icon: briefcase
      price: dès 18 CHF / fiche
    - title: Conseil
      text: Création de société, transmission, budget, financement bancaire.
      detail: Un entretien de cadrage offert ; ensuite au forfait, annoncé à l'avance.
      icon: key
      price: sur devis
  story:
    kicker: Une année avec nous
    title: Quatre rendez-vous, aucune mauvaise surprise.
    steps:
      - label: Janvier
        title: Le bouclement
        text: Vos comptes de l'année précédente sont bouclés et commentés en une page. Vous savez où vous en êtes avant le printemps.
        visual:
          kind: ui
          url: espace.morand-keller.ch
          title: Comptes annuels
          badge: bouclés
          items: [Bilan et compte de résultat, Rapport commenté en une page, Décompte TVA du 4e trimestre]
          bar: 100
          bar_label: Livré le 28 février
      - label: Avril
        title: Les impôts
        text: Déclarations déposées, acomptes ajustés. Une simulation vous dit ce que la prochaine année coûtera.
        visual:
          kind: chart
          title: Charge fiscale simulée (exemple)
          badge: kCHF
          series: [{label: Actuel, value: 42}, {label: Option A, value: 36, hot: true}, {label: Option B, value: 39}]
      - label: Septembre
        title: Le point de mi-parcours
        text: Un entretien d'une heure sur les chiffres à date, la trésorerie et les décisions à prendre avant décembre.
        visual:
          kind: list
          title: À l'ordre du jour
          items: [Chiffre d'affaires à date, Trésorerie à trois mois, Investissements avant la clôture]
      - label: Décembre
        title: Les arbitrages
        text: Salaire ou dividende, amortissements, provisions — on décide ensemble, chiffres à l'appui.
        visual:
          kind: steps
          title: Avant le 31 décembre
          done: 2
          items: [Fixer le salaire de l'associé, Passer les amortissements, Décider du dividende, Signer les comptes]
  proof:
    items:
      - {value: "24 h", label: Délai de réponse, note: Jours ouvrables}
      - {value: "2", label: Experts-comptables diplômés}
      - {value: "60 j", label: Pour un bouclement, note: Après la clôture}
  pricing:
    title: Honoraires
    text: Des forfaits mensuels, sans facturation à la minute.
    items:
      - name: Indépendant
        price: 290 CHF
        unit: / mois
        text: Raison individuelle, sans salarié.
        features: [Comptabilité et TVA, Déclaration d'impôt, Un point par an]
        cta: Demander un entretien
      - name: PME
        price: 690 CHF
        unit: / mois
        text: Sàrl ou SA jusqu'à dix salariés.
        features: [Comptabilité et bouclement, Salaires compris, Fiscalité et simulation, Deux points par an]
        featured: true
        badge: Le plus courant
        cta: Demander un entretien
      - name: Sur mesure
        price: Sur devis
        text: Groupes, holdings, activité internationale.
        features: [Consolidation, TVA multi-pays, Responsable dédié]
        cta: Nous parler
    note: Prix hors TVA. Le premier entretien est offert.
  faq:
    title: Questions fréquentes
    items:
      - q: Puis-je garder mon logiciel comptable ?
        a: Oui. Nous travaillons sur Bexio, Abacus et Banana ; si vous préférez, nous tenons les comptes sur le nôtre.
      - q: Que se passe-t-il en cas de contrôle ?
        a: Nous vous représentons et préparons le dossier. C'est compris dans le forfait, sans supplément.
      - q: Changer de fiduciaire en cours d'année, c'est possible ?
        a: Oui, à tout moment. Nous récupérons les pièces auprès de votre ancien mandataire.
  contact:
    title: Parlons de votre situation
    text: Un premier entretien d'une heure, offert, à Lausanne ou en visio.
  cta:
    title: Le premier entretien est offert.
    text: Une heure pour comprendre votre situation et vous dire ce que nous ferions.
    button: Demander un entretien
en:
  hero:
    kicker: Accounting firm — Lausanne
    title: Clear accounts, calm decisions.
    text: Accounting, tax, payroll and advisory for the self-employed and SMEs of French-speaking Switzerland. Two partners, a team of six, answers within 24 hours.
    cta: Request a meeting
    cta2: Our services
    cta2_href: "#services"
  about:
    title: The firm
    text: Founded by Sophie Morand and Thomas Keller, both certified public accountants, the firm looks after around a hundred mandates, from the family restaurant to the fundraising start-up. We do not bill by the minute and we answer the phone.
    quote: A good accountant calls you before the deadline, not after.
    icon: scale
  split:
    - title: One contact, not a counter
      text: Every mandate has a dedicated manager who knows your file. They call you when something moves — VAT, tax, social security — not only when you ask.
      icon: users
  services_title: Our services
  services:
    - title: Accounting
      text: Bookkeeping, year-end closing, annual accounts, VAT — on your software or ours.
      detail: Bexio, Abacus or Banana. Closing delivered within 60 days of year-end, one-page commented report.
      icon: chart
      price: from CHF 290 / month
    - title: Tax
      text: Individual and corporate returns, legal optimisation, representation before the authorities.
      detail: Simulation before year-end to decide on depreciation, salary and dividend.
      icon: scale
      price: from CHF 450
    - title: Payroll
      text: Payslips, AVS and LPP statements, withholding tax, salary certificates.
      detail: From the first employee. We handle the fund notifications and audits.
      icon: briefcase
      price: from CHF 18 / payslip
    - title: Advisory
      text: Company formation, succession, budgeting, bank financing.
      detail: A scoping meeting is free; then a flat fee, announced in advance.
      icon: key
      price: on quote
  story:
    kicker: A year with us
    title: Four meetings, no bad surprises.
    steps:
      - label: January
        title: The closing
        text: Last year's accounts are closed and commented on one page. You know where you stand before spring.
        visual:
          kind: ui
          url: portal.morand-keller.ch
          title: Annual accounts
          badge: closed
          items: [Balance sheet and P&L, One-page commented report, Q4 VAT return]
          bar: 100
          bar_label: Delivered on 28 February
      - label: April
        title: Taxes
        text: Returns filed, instalments adjusted. A simulation tells you what next year will cost.
        visual:
          kind: chart
          title: Simulated tax burden (example)
          badge: kCHF
          series: [{label: Current, value: 42}, {label: Option A, value: 36, hot: true}, {label: Option B, value: 39}]
      - label: September
        title: The mid-year review
        text: A one-hour meeting on year-to-date figures, cash and the decisions to make before December.
        visual:
          kind: list
          title: On the agenda
          items: [Year-to-date revenue, Three-month cash, Investments before closing]
      - label: December
        title: The trade-offs
        text: Salary or dividend, depreciation, provisions — we decide together, with the numbers.
        visual:
          kind: steps
          title: Before 31 December
          done: 2
          items: [Set the partner's salary, Book depreciation, Decide the dividend, Sign the accounts]
  proof:
    items:
      - {value: "24 h", label: Response time, note: Working days}
      - {value: "2", label: Certified public accountants}
      - {value: "60 d", label: For a closing, note: After year-end}
  pricing:
    title: Fees
    text: Monthly flat fees, no billing by the minute.
    items:
      - name: Self-employed
        price: CHF 290
        unit: / month
        text: Sole proprietorship, no employees.
        features: [Accounting and VAT, Tax return, One review a year]
        cta: Request a meeting
      - name: SME
        price: CHF 690
        unit: / month
        text: Sàrl or SA with up to ten employees.
        features: [Accounting and closing, Payroll included, Tax and simulation, Two reviews a year]
        featured: true
        badge: Most common
        cta: Request a meeting
      - name: Bespoke
        price: On quote
        text: Groups, holdings, international activity.
        features: [Consolidation, Multi-country VAT, Dedicated manager]
        cta: Talk to us
    note: Prices excl. VAT. The first meeting is free.
  faq:
    title: Frequently asked questions
    items:
      - q: Can I keep my accounting software?
        a: Yes. We work on Bexio, Abacus and Banana; if you prefer, we keep the books on ours.
      - q: What happens in case of an audit?
        a: We represent you and prepare the file. It is included in the flat fee, no extra.
      - q: Can I switch firms mid-year?
        a: Yes, at any time. We collect the documents from your previous accountant.
  contact:
    title: Let's talk about your situation
    text: A first one-hour meeting, free, in Lausanne or by video.
  cta:
    title: The first meeting is free.
    text: One hour to understand your situation and tell you what we would do.
    button: Request a meeting
