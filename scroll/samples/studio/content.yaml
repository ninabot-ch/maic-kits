# ÉCHANTILLON du thème « studio » — contenu FICTIF (Nordwand, Zurich). Aucun chiffre ci-dessous ne décrit une vraie entreprise.
fr:
  hero:
    kicker: Studio de création — Zurich
    title: Des marques qu'on reconnaît de loin.
    text: Identité, typographie, film. Un studio de quatre personnes qui livre peu de projets et les livre entiers.
    cta: Parler d'un projet
    cta2: Voir le travail
    cta2_href: "#services"
  services_title: Ce qu'on fait
  services:
    - title: Identité visuelle
      text: Logo, système typographique, couleurs, gabarits — un kit que votre équipe sait utiliser sans nous.
      detail: Six semaines en moyenne, trois rendez-vous. Vous repartez avec les fichiers sources et un guide d'une page.
      icon: palette
      price: dès 9 000 CHF
    - title: Film de marque
      text: Un film court écrit, tourné et monté par le studio, pour votre site et vos réseaux.
      detail: Scénario validé avant le tournage, une journée de plateau, deux versions (16:9 et vertical).
      icon: camera
      price: dès 12 000 CHF
    - title: Site vitrine
      text: Une page qui tient sur la promesse, sans gabarit acheté.
      detail: Design et intégration par le studio, hébergement chez vous, aucune dépendance.
      icon: cpu
      price: dès 6 000 CHF
    - title: Direction artistique
      text: Un regard régulier sur vos campagnes, vos posts, vos supports.
      detail: Deux demi-journées par mois, sans engagement annuel.
      icon: sparkles
      price: 1 800 CHF / mois
  story:
    kicker: Méthode
    title: Un projet, quatre semaines, zéro surprise.
    steps:
      - label: Semaine 1
        title: On écoute
        text: Une demi-journée avec vous. On ressort avec trois mots, un public et une contrainte.
        visual:
          kind: list
          title: Ce qu'on note
          items: [Trois mots qui vous décrivent, Le public à qui l'on parle, La contrainte qu'on ne franchit pas]
      - label: Semaine 2
        title: On explore
        text: Trois pistes, toutes défendables. Vous en gardez une — pas un mélange.
        visual:
          kind: chart
          title: Trois pistes
          badge: votre choix
          series: [{label: Piste A, value: 3}, {label: Piste B, value: 5, hot: true}, {label: Piste C, value: 2}]
      - label: Semaine 3
        title: On construit
        text: La piste devient système — typographie, couleurs, gabarits, animations.
        visual:
          kind: ui
          url: nordwand.ch/kit
          title: Kit de marque
          badge: v1
          items: [Logo et déclinaisons, Système typographique, Palette et contrastes, Gabarits réseaux]
          bar: 65
          bar_label: Livraison en cours
      - label: Semaine 4
        title: On livre
        text: Fichiers sources, guide d'une page, et une heure pour former votre équipe.
        visual:
          kind: steps
          title: Livraison
          done: 3
          items: [Fichiers sources, Guide d'une page, Formation d'une heure, Premier post publié]
  proof:
    items:
      - {value: "4", label: Personnes, note: Toutes au même étage}
      - {value: "6", label: Projets par an, note: Pas un de plus}
      - {value: "4 sem.", label: Durée type d'une identité}
  about:
    title: Le studio
    text: Nordwand est né dans un ancien atelier de Zurich-Ouest. Quatre personnes, un seul planning, aucun stagiaire non payé. On refuse plus de projets qu'on n'en accepte, pour finir ceux qu'on prend.
    icon: palette
  pricing:
    title: Trois formats
    text: Un prix connu avant de commencer.
    items:
      - name: Identité
        price: 9 000 CHF
        unit: dès
        features: [Logo et système, Guide d'une page, Fichiers sources]
        cta: Demander un devis
      - name: Identité + film
        price: 19 000 CHF
        unit: dès
        features: [Tout Identité, Film de 60 s, Version verticale, Deux relectures]
        featured: true
        badge: Le plus complet
        cta: Parler du projet
      - name: Direction artistique
        price: 1 800 CHF
        unit: / mois
        features: [Deux demi-journées, Relecture des supports, Sans engagement]
        cta: Réserver un mois
  faq:
    title: Questions
    items:
      - q: Travaillez-vous avec des petites structures ?
        a: Oui, la plupart de nos clients ont moins de vingt personnes. Le format Identité est pensé pour eux.
      - q: Combien de propositions de logo ?
        a: Trois pistes, puis une seule développée. Un mélange de deux pistes donne toujours un logo faible.
      - q: Gardez-vous les droits ?
        a: Non. Les fichiers sources et les droits d'usage sont à vous dès le paiement final.
  contact:
    title: Un projet en tête ?
    text: Décrivez-le en cinq lignes, on vous dit sous 48 h si on peut le prendre et quand.
  cta:
    title: On commence par une demi-journée.
    text: Sans engagement, à Zurich ou en visio.
    button: Proposer une date
en:
  hero:
    kicker: Design studio — Zurich
    title: Brands you recognise from afar.
    text: Identity, typography, film. A studio of four that takes on few projects and delivers them whole.
    cta: Talk about a project
    cta2: See the work
    cta2_href: "#services"
  services_title: What we do
  services:
    - title: Visual identity
      text: Logo, type system, colours, templates — a kit your team can use without us.
      detail: Six weeks on average, three meetings. You leave with source files and a one-page guide.
      icon: palette
      price: from CHF 9,000
    - title: Brand film
      text: A short film written, shot and edited by the studio, for your site and your channels.
      detail: Script approved before the shoot, one day on set, two versions (16:9 and vertical).
      icon: camera
      price: from CHF 12,000
    - title: Website
      text: One page that holds the promise, no bought template.
      detail: Design and build by the studio, hosted with you, no dependency.
      icon: cpu
      price: from CHF 6,000
    - title: Art direction
      text: A regular eye on your campaigns, posts and materials.
      detail: Two half-days a month, no annual commitment.
      icon: sparkles
      price: CHF 1,800 / month
  story:
    kicker: Method
    title: One project, four weeks, no surprises.
    steps:
      - label: Week 1
        title: We listen
        text: Half a day with you. We leave with three words, an audience and one constraint.
        visual:
          kind: list
          title: What we write down
          items: [Three words that describe you, The audience we speak to, The line we do not cross]
      - label: Week 2
        title: We explore
        text: Three directions, all defensible. You keep one — not a blend.
        visual:
          kind: chart
          title: Three directions
          badge: your choice
          series: [{label: Route A, value: 3}, {label: Route B, value: 5, hot: true}, {label: Route C, value: 2}]
      - label: Week 3
        title: We build
        text: The direction becomes a system — type, colours, templates, motion.
        visual:
          kind: ui
          url: nordwand.ch/kit
          title: Brand kit
          badge: v1
          items: [Logo and variants, Type system, Palette and contrast, Social templates]
          bar: 65
          bar_label: Delivery in progress
      - label: Week 4
        title: We deliver
        text: Source files, a one-page guide, and an hour to train your team.
        visual:
          kind: steps
          title: Delivery
          done: 3
          items: [Source files, One-page guide, One-hour training, First post published]
  proof:
    items:
      - {value: "4", label: People, note: All on the same floor}
      - {value: "6", label: Projects a year, note: Not one more}
      - {value: "4 wks", label: Typical identity project}
  about:
    title: The studio
    text: Nordwand was born in a former workshop in Zurich West. Four people, one schedule, no unpaid interns. We turn down more projects than we take, so we can finish the ones we take.
    icon: palette
  pricing:
    title: Three formats
    text: A price known before we start.
    items:
      - name: Identity
        price: CHF 9,000
        unit: from
        features: [Logo and system, One-page guide, Source files]
        cta: Ask for a quote
      - name: Identity + film
        price: CHF 19,000
        unit: from
        features: [Everything in Identity, 60-second film, Vertical version, Two review rounds]
        featured: true
        badge: Most complete
        cta: Talk about it
      - name: Art direction
        price: CHF 1,800
        unit: / month
        features: [Two half-days, Review of materials, No commitment]
        cta: Book a month
  faq:
    title: Questions
    items:
      - q: Do you work with small teams?
        a: Yes, most of our clients have fewer than twenty people. The Identity format is designed for them.
      - q: How many logo proposals?
        a: Three directions, then one developed. A blend of two directions always gives a weak logo.
      - q: Do you keep the rights?
        a: No. Source files and usage rights are yours on final payment.
  contact:
    title: A project in mind?
    text: Describe it in five lines; within 48 hours we tell you whether we can take it, and when.
  cta:
    title: We start with half a day.
    text: No commitment, in Zurich or by video.
    button: Suggest a date
