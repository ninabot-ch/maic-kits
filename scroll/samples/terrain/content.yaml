# ÉCHANTILLON du thème « terrain » — contenu FICTIF (Bächler Sanitaire, Thoune). Aucun chiffre ci-dessous ne décrit une vraie entreprise.
fr:
  hero:
    kicker: Dépannage 7j/7 — région de Thoune
    title: Réparé aujourd'hui. Pas la semaine prochaine.
    text: Fuite, chaudière en panne, salle de bain à refaire — quatre installateurs, deux camionnettes, et un devis écrit avant de commencer.
    cta: Appeler un dépanneur
    cta2: Nos interventions
    cta2_href: "#services"
  services_title: Nos interventions
  services:
    - title: Dépannage
      text: Fuite, bouchon, chauffe-eau, chaudière — sur place en moins de deux heures dans la région.
      detail: 7 jours sur 7, de 7 h à 22 h. Le déplacement est compris dans la première heure.
      icon: wrench
      price: 140 CHF / h
    - title: Salles de bain
      text: Rénovation complète, de la démolition au carrelage, avec un seul interlocuteur.
      detail: Devis à prix ferme, planning à la semaine, chantier propre chaque soir.
      icon: drop
      price: dès 14 000 CHF
    - title: Chauffage
      text: Pompes à chaleur, remplacement de chaudière, entretien annuel.
      detail: Étude gratuite pour le passage à la pompe à chaleur, aide aux demandes de subvention.
      icon: sun
      price: sur devis
    - title: Entretien
      text: Contrat annuel pour immeubles et PPE — chaudière, adoucisseur, détartrage.
      detail: Une visite par an, rapport écrit, pièces d'usure comprises.
      icon: shield
      price: dès 320 CHF / an
  proof:
    items:
      - {value: "2 h", label: Délai d'intervention, note: Région de Thoune}
      - {value: "4", label: Installateurs, note: Avec CFC}
      - {value: "7/7", label: Dépannage, note: De 7 h à 22 h}
  story:
    kicker: Comment ça se passe
    title: Un chantier, quatre étapes.
    steps:
      - label: Jour 0
        title: L'appel
        text: Vous décrivez le problème, on vous dit qui vient et à quelle heure. Pour un chantier, on passe voir sous 48 h.
        visual:
          kind: map
          city: Thun
          label: Thoune et 30 km autour
      - label: Jour 2
        title: Le devis
        text: "Prix ferme, poste par poste. Pas de « surprises en cours de route » : ce qui n'est pas écrit n'est pas facturé."
        visual:
          kind: ui
          url: devis.baechler.ch/2026-118
          title: Devis salle de bain
          badge: prix ferme
          items: [Démolition et évacuation, Sanitaire et raccordements, Carrelage sol et murs, Meuble et robinetterie]
          bar: 100
          bar_label: Total garanti
      - label: Semaines 1 à 3
        title: Le chantier
        text: Un planning à la semaine, affiché sur la porte. Le chantier est rangé chaque soir, l'eau remise avant de partir.
        visual:
          kind: steps
          title: Planning
          done: 2
          items: [Démolition, Plomberie et électricité, Carrelage, Pose des appareils]
      - label: Fin
        title: La réception
        text: On fait le tour ensemble, on teste tout, vous signez. Garantie de deux ans sur la main-d'œuvre.
        visual:
          kind: stat
          value: "2 ans"
          label: Garantie main-d'œuvre
          sub: Sur tous nos chantiers
  about:
    title: L'entreprise
    text: Fondée par Urs Bächler, installateur sanitaire depuis vingt ans, l'entreprise emploie quatre monteurs de la région et forme un apprenti chaque année. Le dépôt est à Steffisburg, les camionnettes partent à 7 h.
    icon: truck
  split:
    - title: Un devis écrit, toujours
      text: Même pour un dépannage, vous recevez le tarif horaire et le forfait déplacement avant qu'on touche à quoi que ce soit. Sur un chantier, le prix est ferme.
      icon: paper
  pricing:
    title: Tarifs
    text: Prix TTC, déplacement compris dans la région.
    items:
      - name: Dépannage
        price: 140 CHF
        unit: / heure
        features: [Sur place en 2 h, 7 jours sur 7, Déplacement compris]
        cta: Appeler
      - name: Entretien annuel
        price: 320 CHF
        unit: / an
        features: [Chaudière ou pompe à chaleur, Rapport écrit, Pièces d'usure comprises]
        featured: true
        badge: Immeubles et PPE
        cta: Demander un contrat
      - name: Rénovation
        price: Prix ferme
        features: [Devis poste par poste, Planning affiché, Garantie 2 ans]
        cta: Demander une visite
  faq:
    title: Questions fréquentes
    items:
      - q: Intervenez-vous le week-end ?
        a: Oui, samedi et dimanche de 7 h à 22 h, au même tarif horaire. Le déplacement reste compris.
      - q: Faites-vous les demandes de subvention ?
        a: Pour une pompe à chaleur, oui — on prépare le dossier cantonal avec vous, c'est compris dans l'étude.
      - q: Combien de temps pour une salle de bain ?
        a: Trois semaines en général, pour une pièce de taille courante. Le planning est fixé dans le devis.
  contact:
    title: Décrivez le problème
    text: Une photo aide. On vous rappelle dans l'heure pendant les horaires d'ouverture.
  cta:
    title: Une fuite, une panne, un projet ?
    text: Quatre installateurs, deux camionnettes, sur place en deux heures.
    button: Appeler un dépanneur
en:
  hero:
    kicker: 7-day emergency service — Thun area
    title: Fixed today. Not next week.
    text: A leak, a dead boiler, a bathroom to redo — four fitters, two vans, and a written quote before we start.
    cta: Call a plumber
    cta2: Our services
    cta2_href: "#services"
  services_title: Our services
  services:
    - title: Emergency
      text: Leak, blockage, water heater, boiler — on site in under two hours in the area.
      detail: 7 days a week, 7 am to 10 pm. Travel is included in the first hour.
      icon: wrench
      price: CHF 140 / h
    - title: Bathrooms
      text: Full renovation, from demolition to tiling, with a single contact.
      detail: Fixed-price quote, weekly schedule, clean site every evening.
      icon: drop
      price: from CHF 14,000
    - title: Heating
      text: Heat pumps, boiler replacement, annual service.
      detail: Free study for switching to a heat pump, help with subsidy applications.
      icon: sun
      price: on quote
    - title: Maintenance
      text: Annual contract for buildings and condominiums — boiler, softener, descaling.
      detail: One visit a year, written report, wear parts included.
      icon: shield
      price: from CHF 320 / year
  proof:
    items:
      - {value: "2 h", label: Response time, note: Thun area}
      - {value: "4", label: Fitters, note: Certified}
      - {value: "7/7", label: Emergency service, note: 7 am to 10 pm}
  story:
    kicker: How it goes
    title: One job, four steps.
    steps:
      - label: Day 0
        title: The call
        text: You describe the problem, we tell you who is coming and when. For a project, we visit within 48 hours.
        visual:
          kind: map
          city: Thun
          label: Thun and 30 km around
      - label: Day 2
        title: The quote
        text: Fixed price, item by item. No surprises along the way — what is not written is not billed.
        visual:
          kind: ui
          url: quote.baechler.ch/2026-118
          title: Bathroom quote
          badge: fixed price
          items: [Demolition and disposal, Plumbing and connections, Floor and wall tiling, Vanity and taps]
          bar: 100
          bar_label: Guaranteed total
      - label: Weeks 1 to 3
        title: The work
        text: A weekly schedule, posted on the door. The site is tidied every evening, water back on before we leave.
        visual:
          kind: steps
          title: Schedule
          done: 2
          items: [Demolition, Plumbing and electrics, Tiling, Fitting the fixtures]
      - label: End
        title: Handover
        text: We walk through together, test everything, you sign. Two-year warranty on labour.
        visual:
          kind: stat
          value: "2 yrs"
          label: Labour warranty
          sub: On all our jobs
  about:
    title: The company
    text: Founded by Urs Bächler, a plumber for twenty years, the company employs four fitters from the area and trains an apprentice every year. The depot is in Steffisburg; the vans leave at 7 am.
    icon: truck
  split:
    - title: A written quote, always
      text: Even for an emergency, you get the hourly rate and the call-out fee before we touch anything. On a project, the price is fixed.
      icon: paper
  pricing:
    title: Rates
    text: Prices incl. tax, travel included in the area.
    items:
      - name: Emergency
        price: CHF 140
        unit: / hour
        features: [On site in 2 h, 7 days a week, Travel included]
        cta: Call
      - name: Annual maintenance
        price: CHF 320
        unit: / year
        features: [Boiler or heat pump, Written report, Wear parts included]
        featured: true
        badge: Buildings and condos
        cta: Ask for a contract
      - name: Renovation
        price: Fixed price
        features: [Item-by-item quote, Posted schedule, 2-year warranty]
        cta: Ask for a visit
  faq:
    title: Frequently asked questions
    items:
      - q: Do you work at weekends?
        a: Yes, Saturday and Sunday from 7 am to 10 pm, at the same hourly rate. Travel stays included.
      - q: Do you handle subsidy applications?
        a: For a heat pump, yes — we prepare the cantonal file with you; it is part of the study.
      - q: How long for a bathroom?
        a: Three weeks in general, for a standard-sized room. The schedule is set in the quote.
  contact:
    title: Describe the problem
    text: A photo helps. We call you back within the hour during opening hours.
  cta:
    title: A leak, a breakdown, a project?
    text: Four fitters, two vans, on site in two hours.
    button: Call a plumber
