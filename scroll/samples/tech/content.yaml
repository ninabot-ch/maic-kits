      - label: Model
        title: Kestrel tidies the data
        text: Sales, margins, receipts, stock — everything lands in one model, reconciled every night.
        visual: {kind: chart, title: Margin by family (example), badge: this week, unit: " %", series: [{label: Sales, value: 42}, {label: Services, value: 61, hot: true}, {label: Subscriptions, value: 74}, {label: Other, value: 18}]}
