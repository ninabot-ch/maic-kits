# ÉCHANTILLON du thème « tech » — contenu FICTIF (Kestrel, Yverdon-les-Bains). Aucun chiffre ci-dessous ne décrit une vraie entreprise.
fr:
  hero:
    kicker: Nouveau — connecteur Bexio
    title: Vos chiffres, à jour, sans tableur.
    text: Kestrel branche votre comptabilité, votre caisse et votre boutique en ligne, et vous montre chaque matin ce qui compte.
    cta: Essayer 14 jours
    cta2: Voir comment ça marche
    cta2_href: "#story"
  proof:
    items:
      - {value: "1 h", label: Pour brancher vos sources, note: Sans développeur}
      - {value: "12", label: Connecteurs, note: Compta, caisse, e-commerce, banque}
      - {value: "CH", label: Données hébergées en Suisse, note: Centre de données à Gland}
      - {value: "0", label: Ligne de code à écrire, note: Tout se règle à la souris}
  story:
    kicker: Comment ça marche
    title: De la connexion au premier rapport.
    steps:
      - label: Connecter
        title: Branchez vos outils
        text: Bexio, Abacus, SumUp, Shopify, votre banque — un clic par source, autorisation sécurisée, rien à installer.
        visual: {kind: ui, url: app.kestrel.ch/sources, title: Sources connectées, badge: 4 actives, items: [Bexio — comptabilité, SumUp — caisse, Shopify — boutique en ligne, Raiffeisen — compte courant], chips: [Abacus, Stripe, Lightspeed], bar: 80, bar_label: Première synchronisation}
      - label: Modéliser
        title: Kestrel range les données
        text: Ventes, marges, encaissements, stocks — tout arrive dans un même modèle, réconcilié chaque nuit.
        visual: {kind: chart, title: Marge par famille (exemple), badge: cette semaine, unit: " %", series: [{label: Ventes, value: 42}, {label: Services, value: 61, hot: true}, {label: Abonnements, value: 74}, {label: Divers, value: 18}]}
      - label: Lire
        title: Un tableau de bord par métier
        text: Direction, ventes, finance — chaque rôle voit ses indicateurs, sur ordinateur comme sur téléphone.
        visual: {kind: list, title: Un tableau par rôle, items: [Direction — trésorerie et marge, Ventes — pipeline et devis, Finance — encours et échéances]}
      - label: Agir
        title: Les alertes qui comptent
        text: Trésorerie sous un seuil, client en retard, stock critique — vous recevez un message, pas un rapport de 40 pages.
        visual: {kind: calendar, month: Octobre, label: "07:30 chaque matin", days: [1, 2, 3, 6, 7, 8, 9, 10, 13, 14], first_weekday: 3, days_in_month: 31, caption: "Le résumé du matin, dans votre boîte"}
  services_title: Ce que vous obtenez
  services_text: Un abonnement, quatre briques.
  services:
    - title: Tableaux de bord
      text: Des vues prêtes pour la direction, les ventes et la finance — modifiables sans formule.
      detail: Filtres par période, par site et par produit ; export PDF pour le conseil d'administration ou la banque.
      icon: chart
    - title: Alertes
      text: Des seuils que vous fixez, des messages courts par e-mail ou Slack.
      detail: Trésorerie, encours clients, stocks, marge par produit — chaque alerte dit quoi regarder et où.
      icon: bolt
    - title: Prévisions
      text: Trois mois de trésorerie projetée, à partir de vos factures et de vos habitudes de paiement.
      detail: Le modèle apprend de vos retards de paiement réels ; vous ajustez les hypothèses à la main si besoin.
      icon: clock
    - title: Partage
      text: Un lien sécurisé pour votre fiduciaire ou votre banque, en lecture seule, révocable à tout moment.
      detail: Accès par rôle, journal des consultations, données jamais exportées hors de Suisse.
      icon: shield
  about:
    title: Pourquoi Kestrel
    text: Trois fondateurs passés par la finance de PME, lassés de reconstruire le même tableur chaque lundi. Kestrel est né à Yverdon-les-Bains pour que le dirigeant regarde ses chiffres sans les préparer.
    icon: sparkles
  split:
    - title: Vos données restent en Suisse
      text: Hébergement dans un centre de données à Gland, chiffrement au repos, sauvegardes quotidiennes. Vous pouvez tout exporter et tout effacer, à tout moment.
      icon: lock
    - title: Votre fiduciaire aussi
      text: Un accès en lecture pour votre comptable évite les allers-retours de fichiers. Elle voit la même chose que vous, au même moment.
      icon: users
  pricing:
    title: Un prix par entreprise, pas par utilisateur
    text: Sans engagement, résiliable chaque mois.
    items:
      - name: Solo
        price: 49 CHF
        unit: / mois
        text: Pour une raison individuelle ou un premier salarié.
        features: [3 connecteurs, 1 tableau de bord, Alertes par e-mail]
        cta: Essayer
      - name: Équipe
        price: 149 CHF
        unit: / mois
        text: Pour une PME de 2 à 30 personnes.
        features: [Connecteurs illimités, Tableaux par rôle, Prévisions de trésorerie, Accès fiduciaire]
        featured: true
        badge: Le plus choisi
        cta: Essayer 14 jours
      - name: Groupe
        price: Sur devis
        text: Plusieurs sociétés, plusieurs sites.
        features: [Consolidation, Utilisateurs illimités, Accompagnement à la mise en place]
        cta: Nous parler
    note: Prix hors TVA. Essai gratuit de 14 jours, sans carte.
  faq:
    title: Questions fréquentes
    items:
      - q: Faut-il un informaticien pour la mise en place ?
        a: Non. Chaque connecteur s'autorise en un clic depuis votre navigateur, et un premier tableau de bord apparaît dans l'heure.
      - q: Où sont hébergées les données ?
        a: En Suisse, dans un centre de données à Gland. Elles ne quittent jamais le pays, et vous pouvez les exporter ou les effacer quand vous voulez.
      - q: Que se passe-t-il si je résilie ?
        a: Vous exportez tout au format tableur, puis vos données sont effacées sous 30 jours.
      - q: Kestrel remplace-t-il ma comptabilité ?
        a: Non, il la lit. Votre logiciel comptable reste la référence ; Kestrel en fait une lecture claire et quotidienne.
  contact:
    title: Une question avant d'essayer ?
    text: Écrivez-nous, un fondateur vous répond dans la journée.
  cta:
    title: Regardez vos chiffres demain matin.
    text: Quatorze jours d'essai, aucune carte, tout se branche en une heure.
    button: Créer mon compte
