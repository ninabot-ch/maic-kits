        title: One dashboard per role
        text: Management, sales, finance — each role sees its own indicators, on desktop and on the phone.
        visual: {kind: list, title: One dashboard per role, items: [Management — cash and margin, Sales — pipeline and quotes, Finance — receivables and due dates]}
      - label: Act
        title: The alerts that matter
        text: Cash below a threshold, a late customer, critical stock — you get a message, not a 40-page report.
        visual: {kind: calendar, month: October, label: "07:30 every morning", days: [1, 2, 3, 6, 7, 8, 9, 10, 13, 14], first_weekday: 3, days_in_month: 31, caption: "The morning summary, in your inbox"}
  services_title: What you get
  services_text: One subscription, four building blocks.
  services:
    - title: Dashboards
      text: Ready-made views for management, sales and finance — editable without formulas.
      detail: Filters by period, site and product; PDF export for the board or the bank.
      icon: chart
    - title: Alerts
      text: Thresholds you set, short messages by e-mail or Slack.
      detail: Cash, receivables, stock, margin per product — each alert says what to look at and where.
      icon: bolt
    - title: Forecasts
      text: Three months of projected cash, from your invoices and your payment habits.
      detail: The model learns from your real payment delays; you adjust the assumptions by hand if needed.
      icon: clock
    - title: Sharing
      text: A secure, read-only link for your accountant or your bank, revocable at any time.
      detail: Role-based access, viewing log, data never exported outside Switzerland.
      icon: shield
