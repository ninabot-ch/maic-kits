    title: Why Kestrel
    text: Three founders who came through SME finance, tired of rebuilding the same spreadsheet every Monday. Kestrel was born in Yverdon-les-Bains so that owners can look at their numbers without preparing them.
    icon: sparkles
  split:
    - title: Your data stays in Switzerland
      text: Hosted in a data centre in Gland, encrypted at rest, backed up daily. You can export everything and delete everything, at any time.
